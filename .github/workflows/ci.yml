name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # v2 E4 (backlog 7): exactly the server's Node (deploy/install-node.sh pins v24.22.2; PLAN section 3.1), from .nvmrc,
      # so CI, the server and a developer's nvm agree. Keep the two in step. The run fails at once on another major.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Node is 24 (the server's version)
        run: node -e "const m=+process.versions.node.split('.')[0]; console.log('node', process.versions.node); if (m !== 24) { console.error('expected Node 24'); process.exit(1); }"
      - run: npm ci
      - name: Deployment scripts pass shellcheck (preinstalled on ubuntu-latest)
        run: shellcheck -x deploy/*.sh
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format
      - name: Registry is current and matches the SDK spec
        run: npm run gen:registry -- --check && npm run check:drift
      - name: Phase 0 spike dry run (mock LegendKeeper, including check 1's clean-up after a forced failure)
        run: npx vitest run test/tools/spike-v2-dryrun.test.ts test/tools/spike-wrapper.test.ts
      - name: Unit and contract tests (sandbox tests are opt-in and never run here)
        run: npm test
      - run: npm run build
